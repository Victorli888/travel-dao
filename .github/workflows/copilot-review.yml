# Asks GitHub Copilot to review a pull request.
#
# Uses the Copilot code review endpoint. A 201 starts a review. A 409 means
# one is already pending, which is the same outcome. Drafts are skipped until
# they are marked ready.
#
# github-actions[bot] has no Copilot seat, so this call often returns 422
# under GITHUB_TOKEN. Add a fine-grained PAT as the COPILOT_REVIEW_TOKEN
# secret, owned by an account that can request Copilot code review, with
# Pull requests: Read and write on this repository. The workflow uses that
# secret when it is set.

name: Copilot review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  request:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Request Copilot code review
        env:
          GH_TOKEN: ${{ secrets.COPILOT_REVIEW_TOKEN || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          set +e
          raw=$(gh api \
            --method POST \
            --input - \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -i \
            "repos/${REPO}/pulls/${PR}/copilot-code-review" \
            <<<'{}' 2>&1)
          status=$?
          set -e
          printf '%s\n' "$raw"
          code=$(printf '%s\n' "$raw" | awk 'toupper($0) ~ /^HTTP\// { c = $2 } END { print c }')
          case "$code" in
            201|409)
              exit 0
              ;;
          esac
          echo "::error::Copilot review was not requested (HTTP ${code:-unknown}, gh exit ${status}). If this is 422, the token has no Copilot seat. Add COPILOT_REVIEW_TOKEN as a fine-grained PAT from an account that can request Copilot code review."
          exit 1
